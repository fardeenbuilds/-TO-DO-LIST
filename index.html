<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="New-App.css">
</head>

<body>
    <main class="container">

        <header class="header">
            <h1>My To-Do List</h1>
            <p id="counter" class="counter" aria-live="polite"></p>
        </header>

        <form id="taskForm" class="add-form">
            <input type="text" id="taskInput" placeholder="Enter a task" maxlength="120" autocomplete="off" aria-label="New task">
            <button type="submit" class="btn-add">Add Task</button>
        </form>

        <p id="error" class="error" role="alert"></p>

        <div class="filters" role="group" aria-label="Filter tasks">
            <button class="filter active" data-filter="all">All</button>
            <button class="filter" data-filter="active">Pending</button>
            <button class="filter" data-filter="done">Completed</button>
        </div>

        <ul id="taskList"></ul>

        <p id="empty" class="empty"></p>

        <footer class="footer">
            <button id="clearDone" class="btn-clear">Clear completed</button>
        </footer>

    </main>

    <script src="New-App.js"></script>
</body>
</html>
